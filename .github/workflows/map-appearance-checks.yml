name: Map appearance compile and regression checks
on:
  push:
    branches: [feature/map-ui-route-customization-20261028]
    paths:
      - 'android-gps-simulator/**'
      - '.github/workflows/map-appearance-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-gps-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Compile and run JVM regression tests (no APK)
        run: bash ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Android lint
        run: bash ./gradlew :app:lintDebug
      - name: Print all lint errors for actionable diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              issues = [x for x in root.findall("issue") if x.get("severity") in ("Error", "Fatal")]
              for x in issues:
                  loc = x.find("location")
                  print("LINT_ERROR", x.get("id"), x.get("message"), (loc.attrib if loc is not None else {}))
              print("TOTAL_LINT_ERRORS", len(issues))
          else:
              print("Lint XML report unavailable")
          PY
      - name: Upload checks (no installable artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-appearance-check-results
          path: |
            android-gps-simulator/app/build/reports/tests/
            android-gps-simulator/app/build/test-results/
            android-gps-simulator/app/build/reports/lint-results-debug.*
