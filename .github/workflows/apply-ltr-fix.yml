name: Apply LTR interface fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ltr-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply LTR and map layout fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-gps-simulator')

          nav = root / 'app/src/main/java/com/rork/gpssimulator/ui/navigation/AppNavigation.kt'
          text = nav.read_text()
          old = '''    val isArabic = settings.language == AppLanguage.ARABIC ||
                  Locale.getDefault().language.equals("ar", ignoreCase = true)
              val layoutDirection = if (isArabic) LayoutDirection.Rtl else LayoutDirection.Ltr
          '''
          new = '''    val isArabic = settings.language == AppLanguage.ARABIC
              // Keep the complete application UI physically left-to-right even when
              // Android itself is using an RTL system language.
              val layoutDirection = LayoutDirection.Ltr
          '''
          if old not in text:
              raise SystemExit('AppNavigation LTR block not found')
          text = text.replace(old, new)
          text = text.replace('import java.util.Locale\n', '')
          nav.write_text(text)

          map_file = root / 'app/src/main/java/com/rork/gpssimulator/ui/screens/MapScreen.kt'
          text = map_file.read_text()
          old = '''            // Use an absolute-right arrangement so the menu remains on the physical
                      // right edge even when the device/system layout direction is RTL.
                      Row(
                          modifier = Modifier
                              .align(Alignment.Center)
                              .fillMaxWidth()
                              .padding(horizontal = 12.dp),
                          horizontalArrangement = Arrangement.Absolute.Right,
                      ) {
          '''
          new = '''            // Keep the four map control buttons on the physical right side,
                      // while opening the floating navigation panel on the physical left.
                      Row(
                          modifier = Modifier
                              .align(Alignment.Center)
                              .fillMaxWidth()
                              .padding(horizontal = 12.dp),
                          horizontalArrangement = Arrangement.Absolute.Left,
                      ) {
          '''
          if old not in text:
              raise SystemExit('MapScreen floating menu block not found')
          text = text.replace(old, new)
          map_file.write_text(text)

          fmt = root / 'app/src/main/java/com/rork/gpssimulator/util/Format.kt'
          text = fmt.read_text()
          text = text.replace('java.text.SimpleDateFormat("d MMM yyyy · HH:mm", Locale.getDefault())',
                              'java.text.SimpleDateFormat("d MMM yyyy · HH:mm", root)')
          text = text.replace('java.text.SimpleDateFormat("HH:mm", Locale.getDefault())',
                              'java.text.SimpleDateFormat("HH:mm", root)')
          fmt.write_text(text)

          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text()
          if 'versionCode = 14' not in text or 'versionName = "1.1.12"' not in text:
              raise SystemExit('Expected 1.1.12 / versionCode 14 not found')
          text = text.replace('versionCode = 14', 'versionCode = 15')
          text = text.replace('versionName = "1.1.12"', 'versionName = "1.1.13"')
          gradle.write_text(text)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Rork-Agent"
          git config user.email "57716265+mohammad-km@users.noreply.github.com"
          git add android-gps-simulator/app/src/main/java/com/rork/gpssimulator/ui/navigation/AppNavigation.kt \
                  android-gps-simulator/app/src/main/java/com/rork/gpssimulator/ui/screens/MapScreen.kt \
                  android-gps-simulator/app/src/main/java/com/rork/gpssimulator/util/Format.kt \
                  android-gps-simulator/app/build.gradle.kts
          git diff --cached --check
          git commit -m "Force LTR layout and move floating menu left"
          git push origin main
