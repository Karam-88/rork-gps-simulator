name: Rating dialog verification
on:
  workflow_dispatch:
  push:
    branches: [feature/premium-rating-dialog-20261026]
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Unit tests and debug builds
        working-directory: android-gps-simulator
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native dialog tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android-gps-simulator/scripts/check-rating-ui.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rating-dialog-verification
          path: |
            rating-screenshots/
            android-gps-simulator/app/build/reports/androidTests/
            android-gps-simulator/app/build/reports/tests/
            android-gps-simulator/app/build/outputs/apk/debug/
          retention-days: 14
