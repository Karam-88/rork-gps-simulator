name: Build Android APK and Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/combined-dex-share-rating-1-1-15
      - release/1.1.16-rc
      - feature/meta-sdk-on-1.1.16-stable
      - feature/gps-overhaul-phase1-20261025
      - fix/post-v26-controls-20261026
      - integration/gps-rating-internal-v28
      - feature/remaining-map-ui-fixes-20261027
  pull_request:
    branches:
      - main
      - release/1.1.16-rc

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: android-gps-simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Google Maps key
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY repository secret is missing."
            exit 1
          fi

      # Debug artifacts are not a reliable Maps QA signal: a CI debug keystore
      # does not necessarily match the SHA-1 authorized for the production Maps key.
      # On branch pushes the signed release APK is the preferred QA artifact;
      # a Play-signed internal-track install may still be required if the upload
      # certificate differs from the Play App Signing certificate.
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify R8 Release build (PR only)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload R8 test AAB (not signed for Play)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-r8-test-aab-not-for-play
          path: android-gps-simulator/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-r8-mapping-test
          path: android-gps-simulator/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-debug-apk
          path: android-gps-simulator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check Play signing secrets
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "SIGNED_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "Signed release skipped: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
          else
            echo "SIGNED_RELEASE_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Restore release keystore
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          chmod 600 release-keystore.jks
          test -s release-keystore.jks

      - name: Create signing configuration
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        run: |
          cat > key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 key.properties

      - name: Build signed Release APK and AAB
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Verify no advertising ID permission in signed release APK
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/release-permissions.txt
          if grep -Fq 'com.google.android.gms.permission.AD_ID' /tmp/release-permissions.txt; then
            echo "::error::AD_ID permission unexpectedly present in release APK; check remaining SDKs."
            exit 1
          fi

      - name: Verify no advertising ID permission in signed release AAB
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$AAB"
          python3 - "$AAB" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert 'base/manifest/AndroidManifest.xml' in names, 'Missing base manifest in AAB'
              manifest = archive.read('base/manifest/AndroidManifest.xml')
              # Android App Bundles encode the manifest as protobuf, not plain XML.
              # The permission string must occur in the base module's string table.
              if b'com.google.android.gms.permission.AD_ID' in manifest:
                  raise SystemExit('AD_ID is unexpectedly present in base AAB manifest: check remaining SDKs')
              print('AD_ID permission string absent from base AAB manifest')
          PY

      - name: Upload signed Release APK
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-release-apk
          path: android-gps-simulator/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release R8 mapping for Play Console
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-release-mapping
          path: android-gps-simulator/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Release AAB
        if: github.event_name != 'pull_request' && env.SIGNED_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gps-simulator-release-aab
          path: android-gps-simulator/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing files
        if: always() && github.event_name != 'pull_request'
        run: rm -f release-keystore.jks key.properties
