name: Responsive onboarding device checks
on:
  push:
    branches: [feature/responsive-animated-onboarding-20261030]
permissions:
  contents: read
jobs:
  device-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Compile app and instrumentation tests
        working-directory: android-gps-simulator
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Small, standard, large and 160% font in Arabic and English
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android-gps-simulator/scripts/check-onboarding-ui.sh
      - name: Collect screenshots even on a failed device assertion
        if: always()
        run: |
          mkdir -p onboarding-screenshots
          adb pull /sdcard/Android/data/com.rork.gpssimulator/files/onboarding-screenshots/. onboarding-screenshots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-device-evidence
          path: |
            onboarding-screenshots/
            android-gps-simulator/app/build/reports/tests/
            android-gps-simulator/app/build/test-results/
